<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamentto de Caixa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            position: relative;
            background: rgb(73, 8, 73) url('img/target001.png');
            background-size: 100% 100%;
            max-width: 800px;
            height: 400px;
            margin: auto;
            margin-top: 30px;
        }

        .conteudo {
            position: absolute;
            background: yellow url('img/target001.png');
            background-size: 100% 100%;
            width: 250px;
            height: 150px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

        }

    </style>

</head>
<body>
    <section class="container">
        <article class="conteudo">

        </article>
    </section>   
</body>
</html>
