<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cap28 - Aula11 - Grid</title>

    <style>
        .container {
            background-color: rgb(77, 77, 219);
            width: 415px;
            height: 315px;
            padding: 5px;
            display: grid;
            gap: 5px;
            grid-template: repeat(3, 100px) / repeat(4, 100px);


        }

        .caixa1 {
            background-color: tomato;
            padding: 10px;
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 5;

            text-align: center;
        }
        .caixa2 {
            background-color: tomato;
            padding: 10px;
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 1;
            grid-column-end: 3;
        }

        .caixa3 {
            background-color: tomato;
            padding: 10px;
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 5;
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="caixa1">1</div>
        <div class="caixa2">2</div>
        <div class="caixa3">3</div>
    </div>    
</body>
</html>
