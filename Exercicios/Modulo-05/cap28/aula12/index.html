<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cap28 - Aula12 - Grid</title>

    <style>
        .container {
            background-color: rgb(74, 74, 201);
            padding: 10px;
            display: grid;
            gap: 5px;
            grid-template: repeat(3, 100px) / repeat(4, 100px);
        }

        .caixa1 {
            background-color: tomato;
            /*
            grid-row: 1 / 4;
            grid-column: 1 / 3;
            */
            grid-area: 1 / 1 / 4 / 3;
        }

        .caixa2 {
            background-color: turquoise;
            /*
            grid-row: 1 / 4;
            grid-column: 3 / 5;
            */
            grid-area: 1 / 3 / 4 / 5;
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="caixa1">1</div>
        <div class="caixa2">2</div>
    </div>        
</body>
</html>
