<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cap28 - Aula12 - Desafio Grid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            background-color: rgb(42, 42, 42);
            width: 100vw;
            height: 100vh;
            padding: 5px;
            margin: auto;
            display: grid;
            grid-template: 1.5fr 0.5fr 3.5fr 0.5fr / 2fr 1fr;
            gap: 5px;
            
        }

        .topo {
            background-color: rgb(64, 64, 179);
            color: white;
            padding: 5px;
            grid-area: 1 / 1 / 2 / 3;
            text-align: center;
            align-content: center;            
        }

        .menu {
            background-color: gray;
            color: white;
            padding: 5px;
            grid-area: 2 / 1 / 3 / 3;
            text-align: center;
            align-content: center;   
        }

        .principal {
            background-color: bisque;
            padding: 5px;
            grid-area: 3 / 1 / 4 / 2;
            text-align: center;
            align-content: center;
        }

        .secundario {
            background-color: rgb(164, 164, 59);
            padding: 5px;
            grid-area: 3 / 2 / 4 / 3;
            text-align: center;
            align-content: center;
        }

        footer {
            background-color: rgb(64, 64, 179);
            color: white;
            grid-area: 4 / 1 / 5 / 3;
            text-align: center;
            align-content: center;

        }

    </style>

</head>
<body>
    <div class="container">
        <header class="topo">Topo</header>
        <nav class="menu">Menu</nav>
        <main class="principal">Principal</main>
        <section class="secundario">Secundario</section>
        <footer>Rodape</footer>
    </div>
</body>
</html>
