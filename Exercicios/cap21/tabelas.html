<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Primeira Tabela</title>
    <style>
        table{
            border: 1px solid black;
            border-collapse: collapse;
            width: 600px;
            padding: 3px;
        }

        .tabela1{
            width: 600px;
            padding: 5px;
            background-color: bisque;
            border: 1px solid black;
        }
        td{
            border: 1px solid grey;
            height: 5px;
            padding: 5px;
        }
        #menor{
            width: 50px;
        }
    </style>
</head>
<body>
    <h1>Primeira Tabela Simples</h1>    
    <div class="tabela1">
        <table>
            <tr>
                <td>A1</td>
                <td>B1</td>
                <td id="menor">C1</td>
            </tr>
            <tr>
                <td>A2</td>
                <td>B2</td>
                <td id="menor">C2</td>
            </tr>
            <tr>
                <td>A3</td>
                <td>B3</td>
                <td id="menor">C3</td>
            </tr>
        </table>
    </div>
</body>
</html>
